<style>
.auth-logo { display:flex; flex-direction:column; align-items:center; gap:.4rem; margin-bottom:1.25rem }
.auth-logo-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--accent) 0%,#818cf8 100%); border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:1.6rem; box-shadow:0 6px 16px rgba(99,102,241,.3) }
.auth-logo-name { font-size:.95rem; font-weight:700; color:var(--text-d) }
.auth-logo-sub  { font-size:.7rem; color:var(--muted-d); margin-top:-2px }
.auth-card h1   { font-size:1.1rem; margin-bottom:1.25rem; text-align:center }
.form-group input:focus, .form-group select:focus { border-color:var(--accent) !important; box-shadow:0 0 0 3px rgba(99,102,241,.15) }
</style>

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon">🏆</div>
        <span class="auth-logo-name">Tipovačka 3.0</span>
        <span class="auth-logo-sub">Tipovací liga</span>
    </div>

    <h1>{{tr .Lang "reset_title"}}</h1>

    {{if .Invalid}}
    <div class="alert alert-error">{{tr .Lang "reset_invalid"}}</div>
    <p class="auth-switch"><a href="/forgot-password">{{tr .Lang "reset_again"}}</a></p>
    {{else}}
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="post" action="/reset-password/{{.Token}}">
        <div class="form-group">
            <label for="password">{{tr .Lang "reset_pw_label"}}</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="{{tr .Lang "reset_pw_ph"}}" />
        </div>
        <div class="form-group">
            <label for="password2">{{tr .Lang "reset_pw2_label"}}</label>
            <input type="password" id="password2" name="password2" required minlength="8" placeholder="{{tr .Lang "reset_pw2_ph"}}" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">{{tr .Lang "reset_submit"}}</button>
    </form>
    {{end}}
</div>
