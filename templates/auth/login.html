<style>
.auth-logo { display:flex; flex-direction:column; align-items:center; gap:.4rem; margin-bottom:1.25rem }
.auth-logo-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--accent) 0%,#818cf8 100%); border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:1.6rem; box-shadow:0 6px 16px rgba(99,102,241,.3) }
.auth-logo-name { font-size:.95rem; font-weight:700; color:var(--text-d) }
.auth-logo-sub  { font-size:.7rem; color:var(--muted-d); margin-top:-2px }
.auth-card h1   { font-size:1.1rem; margin-bottom:1.25rem; text-align:center }
.form-group input:focus, .form-group select:focus { border-color:var(--accent) !important; box-shadow:0 0 0 3px rgba(99,102,241,.15) }
.auth-divider   { display:flex; align-items:center; gap:.75rem; margin:.85rem 0; color:var(--muted-d); font-size:.75rem }
.auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background:var(--border-d) }
</style>

<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon">🏆</div>
        <span class="auth-logo-name">Tipovačka 3.0</span>
        <span class="auth-logo-sub">Tipovací liga</span>
    </div>

    <h1>{{tr .Lang "login_title"}}</h1>

    {{if .Flash}}
    <div class="alert {{if eq (index .Flash "type") "ok"}}alert-success{{else}}alert-error{{end}}">{{index .Flash "msg"}}</div>
    {{end}}
    {{if .Error}}
    <div class="alert alert-error">{{.Error}}</div>
    {{end}}

    <form method="post" action="/login">
        <div class="form-group">
            <label for="email">{{tr .Lang "login_or_nick"}}</label>
            <input type="text" id="email" name="email" required autocomplete="email" placeholder="{{tr .Lang "login_nick_ph"}}" />
        </div>
        <div class="form-group">
            <label for="password">{{tr .Lang "login_password"}}</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">{{tr .Lang "login_submit"}}</button>
    </form>

    <p class="auth-switch" style="margin-top:.6rem">
        <a href="/forgot-password" style="font-size:.82rem;color:var(--muted-d)">{{tr .Lang "login_forgot"}}</a>
    </p>
    <div class="auth-divider">nebo</div>
    <p class="auth-switch">
        {{tr .Lang "login_no_account"}} <a href="/register">{{tr .Lang "login_register_link"}}</a>
    </p>
</div>
